      getStartedBtn.addEventListener('click', function() {
        this.classList.add('opacity-90');
        setTimeout(() => this.classList.remove('opacity-90'), 150);
      });
    }

    if (loginBtn) {
      loginBtn.addEventListener('click', function() {
